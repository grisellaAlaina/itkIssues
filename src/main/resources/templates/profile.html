<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>User Profile</h1>
<p><strong>Name:</strong> <span th:text="${name}">Unknown</span></p>
<p><strong>Login:</strong> <span th:text="${login}">Unknown</span></p>
<p><strong>ID:</strong> <span th:text="${id}">Unknown</span></p>
<p><strong>Email:</strong> <span th:text="${email}">Unknown</span></p>

<form th:action="@{/logout}" method="post">
    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
    <button type="submit">Выйти из системы</button>
</form>

<p>
    Если вы хотите отозвать доступ данного приложения через GitHub,
    перейдите по <a href="https://github.com/settings/applications" target="_blank">ссылке</a> и отозовите доступ вручную.
</p>
</body>
</html>
